name: Generate Claude Pac-Man contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "pacman_dark.svg"
      - "pacman_light.svg"

concurrency:
  group: profile-main-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch contribution calendar
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/fetch_calendar.py
      - name: Build animated Claude Pac-Man graph
        run: python tools/build_pacman.py
      - name: Commit generated graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pacman_dark.svg pacman_light.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh generated profile assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Push failed after 5 attempts" >&2
          exit 1
