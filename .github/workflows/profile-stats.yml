name: Update profile statistics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "pacman_dark.svg"
      - "pacman_light.svg"
      - "assets/terminal.svg"
      - "assets/terminal-light.svg"

# Prevent overlapping runs from racing while committing refreshed SVG files.
concurrency:
  group: profile-main-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python .github/scripts/update_stats.py
      - name: Commit updated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg assets/terminal-light.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh generated profile assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Push failed after 5 attempts" >&2
          exit 1

# Refresh profile statistics after PROFILE_TOKEN setup.
